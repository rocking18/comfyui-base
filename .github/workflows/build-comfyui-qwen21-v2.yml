name: Build RunPod ComfyUI 0.38.0 from official CUDA 13 image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image derived from official RunPod CUDA 13 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.qwen21
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/comfyui-qwen21:0.38.0-cu130-gpu-only-v2
          cache-from: type=gha
          cache-to: type=gha,mode=max
