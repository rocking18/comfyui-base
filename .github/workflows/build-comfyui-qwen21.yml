name: Build RunPod ComfyUI 0.38.0 (CUDA 13, GPU-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the official RunPod ComfyUI source fork
        uses: actions/checkout@v4

      - name: Pin ComfyUI 0.38.0 and force --gpu-only at startup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          bake_path = Path("docker-bake.hcl")
          bake = bake_path.read_text()
          bake_pattern = re.compile(
              r'(variable\s+"COMFYUI_VERSION"\s*\{\s*default\s*=\s*)"[^"]+"',
              re.MULTILINE,
          )
          bake, changed = bake_pattern.subn(r'\1"v0.38.0"', bake, count=1)
          if changed != 1:
              sys.exit('ERROR: Could not find the COMFYUI_VERSION default in docker-bake.hcl; no image built.')
          bake_path.write_text(bake)
          print('Pinned COMFYUI_VERSION to v0.38.0')

          start_path = Path("start.sh")
          start = start_path.read_text()
          marker = 'ARGS_FILE="/workspace/runpod-slim/comfyui_args.txt"\nif [ ! -f "$ARGS_FILE" ]; then\n    echo "# Add your custom ComfyUI arguments here (one per line)" > "$ARGS_FILE"\n    echo "Created empty ComfyUI arguments file at $ARGS_FILE"\nfi\n'
          injected_marker = "# Custom image: ensure --gpu-only is present on every startup."
          if injected_marker not in start:
              if marker not in start:
                  sys.exit('ERROR: Could not find the expected comfyui_args.txt initialization block in start.sh; no image built.')
              addition = marker + '\n' + injected_marker + '\nif ! grep -qw -- \'--gpu-only\' "$ARGS_FILE"; then\n    printf \'%s\\n\' \'--gpu-only\' >> "$ARGS_FILE"\nfi\n'
              start = start.replace(marker, addition, 1)
              start_path.write_text(start)
          print('Configured startup to add --gpu-only if it is not already present')
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the CUDA 13 image
        shell: bash
        env:
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER="$(printf '%s' "$GH_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/comfyui-qwen21:0.38.0-cu130-gpu-only"
          echo "Publishing ${IMAGE}"
          docker buildx bake cuda13 --push --set "cuda13.tags=${IMAGE}"
